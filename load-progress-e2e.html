<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>load-progress e2e</title>
    </head>
    <body>
        <div id="gsviewer"></div>
        <pre id="result">PENDING</pre>
        <script type="module">
            import { Reall3dViewer } from './src/reall3d/viewer/Reall3dViewer';
            import { ModelStatus } from './src/reall3d/modeldata/ModelData';

            const SAMPLE_URL = './testdata/load-progress/load-progress-test.splat';
            const INVALID_URL = './testdata/load-progress/invalid-test.splat';
            const wait = ms => new Promise(r => setTimeout(r, ms));

            const results = [];
            const record = (name, ok, detail) => results.push({ name, ok, detail });

            const waitUntil = async (predicate, timeout = 8000, interval = 100) => {
                const start = performance.now();
                while (performance.now() - start < timeout) {
                    if (predicate()) return true;
                    await wait(interval);
                }
                return false;
            };

            const assertClean = p => {
                const nums = [p.progress, p.downloadSize, p.fileSize, p.dataSplatCount, p.modelSplatCount];
                return nums.every(n => Number.isFinite(n) && n >= 0) && p.progress <= 100;
            };

            try {
                // ---- Case 0: empty snapshot before any model ----
                let viewer = new Reall3dViewer({ debugMode: false, shDegree: 3, disableDropLocalFile: true });
                let p = viewer.getLoadProgress();
                record(
                    'empty-before-addModel',
                    p.status === 'FetchReady' && p.progress === 0 && assertClean(p),
                    p,
                );

                // ---- Case 1: normal .splat reaches FetchDone at 100% ----
                await viewer.addModel({ url: SAMPLE_URL, format: 'splat' });
                const reachedDone = await waitUntil(() => {
                    const s = viewer.getLoadProgress();
                    return s.status === 'FetchDone' || s.status === 'FetchFailed' || s.status === 'Invalid';
                });
                p = viewer.getLoadProgress();
                record(
                    'normal-fetch-done',
                    reachedDone &&
                        p.status === 'FetchDone' &&
                        p.progress === 100 &&
                        p.modelSplatCount === 1000 &&
                        p.dataSplatCount === 1000 &&
                        p.fileSize === 32000 &&
                        p.downloadSize === 32000 &&
                        assertClean(p),
                    p,
                );

                // ---- Case 2: dispose returns empty snapshot, never throws ----
                viewer.dispose();
                let threw = false;
                let afterDispose;
                try {
                    afterDispose = viewer.getLoadProgress();
                } catch (e) {
                    threw = true;
                }
                record(
                    'dispose-empty-snapshot',
                    !threw &&
                        afterDispose.status === 'FetchReady' &&
                        afterDispose.progress === 0 &&
                        assertClean(afterDispose),
                    afterDispose,
                );

                // ---- Case 3: invalid data -> Invalid ----
                viewer = new Reall3dViewer({ debugMode: false, shDegree: 3, disableDropLocalFile: true });
                await viewer.addModel({ url: INVALID_URL, format: 'splat' });
                const reachedInvalid = await waitUntil(() => {
                    const s = viewer.getLoadProgress();
                    return s.status === 'Invalid' || s.status === 'FetchFailed';
                });
                p = viewer.getLoadProgress();
                record('invalid-data-status', reachedInvalid && (p.status === 'Invalid' || p.status === 'FetchFailed') && assertClean(p), p);

                // ---- Case 4: fetchLimit abort -> FetchAborted, progress by points and <= 100 ----
                // fetchLimit is driven by meta.maxRenderCountOfPc via the SplatMesh library API
                viewer.dispose();
                viewer = new Reall3dViewer({ debugMode: false, shDegree: 3, disableDropLocalFile: true });
                const splatMesh = viewer.splatMesh;
                splatMesh.addModel({ url: SAMPLE_URL, format: 'splat' }, { maxRenderCountOfPc: 200 });
                const reachedAbort = await waitUntil(() => {
                    const s = viewer.getLoadProgress();
                    return s.status === 'FetchAborted' || s.status === 'FetchDone';
                });
                p = viewer.getLoadProgress();
                record(
                    'fetchlimit-abort',
                    reachedAbort &&
                        p.status === 'FetchAborted' &&
                        p.modelSplatCount === 1000 &&
                        p.dataSplatCount <= 200 &&
                        p.progress > 0 &&
                        p.progress <= 100 &&
                        Math.abs(p.progress - (p.dataSplatCount / p.modelSplatCount) * 100) < 1e-9 &&
                        assertClean(p),
                    p,
                );

                // ---- Case 5: SplatMesh-level forwarding gives the same snapshot shape ----
                record('splatmesh-accessible', !!splatMesh, !!splatMesh);
                const fromMesh = splatMesh.getLoadProgress();
                record('splatmesh-snapshot-clean', !!fromMesh.status && assertClean(fromMesh), fromMesh);

                viewer.dispose();
            } catch (e) {
                record('unexpected-exception', false, { message: e?.message, stack: e?.stack });
            }

            const allOk = results.every(r => r.ok);
            document.querySelector('#result').textContent = JSON.stringify(
                { allOk, results },
                null,
                2,
            );
            document.title = allOk ? 'E2E_RESULT:PASS' : 'E2E_RESULT:FAIL';
        </script>
    </body>
</html>
